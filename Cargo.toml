[package]
name = "typst-tui"
description = "A terminal editor for Typst documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[workspace]
members = [
    "crates/compiler",
    "crates/config",
    "crates/document",
    "crates/render",
    "crates/theme",
    "crates/tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
ropey = "1.6.1"
thiserror = "2.0.19"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
typst-tui-app = { path = "crates/tui" }
typst-tui-document = { path = "crates/document" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[dependencies]
anyhow.workspace = true
clap.workspace = true
typst-tui-app.workspace = true

[lints]
workspace = true
