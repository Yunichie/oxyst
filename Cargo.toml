[package]
name = "oxyst"
description = "A terminal editor for Typst documents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[workspace]
members = [
    "crates/compiler",
    "crates/config",
    "crates/document",
    "crates/render",
    "crates/theme",
    "crates/tui",
]
exclude = ["vendor/ratatui-image"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify = "8.2.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }
ropey = "1.6.1"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
toml = "0.9.8"
typst = "0.15.1"
typst-ide = "0.15.1"
typst-kit = { version = "0.15.1", features = ["datetime", "embedded-fonts", "scan-fonts", "system-downloader", "system-packages"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-syntax = "0.15.1"
typst-svg = "0.15.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
oxyst-app = { path = "crates/tui" }
oxyst-compiler = { path = "crates/compiler" }
oxyst-config = { path = "crates/config" }
oxyst-document = { path = "crates/document" }
oxyst-render = { path = "crates/render" }
oxyst-theme = { path = "crates/theme" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[dependencies]
anyhow.workspace = true
clap.workspace = true
oxyst-app.workspace = true
oxyst-config.workspace = true

[lints]
workspace = true

[patch.crates-io]
ratatui-image = { path = "vendor/ratatui-image" }
